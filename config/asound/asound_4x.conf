# /etc/asound.conf
#
# ICS 4x / MCH audio profile
#
# Physical/logical port mapping:
#
# Port 1 = capture channel 1 / playback channel 1
# Port 2 = capture channel 0 / playback channel 0
# Port 3 = capture channel 3 / playback channel 3
# Port 4 = capture channel 2 / playback channel 2
#
# TX mapping established from physical testing.
# RX mapping derived from corresponding channel arrangement.
#
# ALSA format:
# 48000 Hz, S32_LE

pcm.loophw {
    type hw
    card Loopback
    device 0
    subdevice 0
}

pcm.loopout {
    type plug
    slave.pcm "loophw"
}

# -----------------------------
# RX: capture chain
# -----------------------------

pcm.dsnoop_rx_all {
    type dsnoop
    ipc_key 3000
    slave {
        pcm "hw:0,0"
        channels 4
        rate 48000
        format S32_LE
    }
}

pcm.route_rx1 {
    type route
    slave.pcm "dsnoop_rx_all"
    slave.channels 10
    ttable.1.0 1
}

pcm.route_rx2 {
    type route
    slave.pcm "dsnoop_rx_all"
    slave.channels 10
    ttable.0.0 1
}

pcm.route_rx3 {
    type route
    slave.pcm "dsnoop_rx_all"
    slave.channels 10
    ttable.3.0 1
}

pcm.route_rx4 {
    type route
    slave.pcm "dsnoop_rx_all"
    slave.channels 10
    ttable.2.0 1
}

pcm.rx1 {
    type plug
    slave.pcm "route_rx1"
}

pcm.rx2 {
    type plug
    slave.pcm "route_rx2"
}

pcm.rx3 {
    type plug
    slave.pcm "route_rx3"
}

pcm.rx4 {
    type plug
    slave.pcm "route_rx4"
}

# -----------------------------
# TX: playback chain
# -----------------------------

pcm.dmix_tx_all {
    type dmix
    ipc_key 4000
    slave {
        pcm "hw:0,0"
        channels 4
        rate 48000
        format S32_LE
    }
}

pcm.route_tx1 {
    type route
    slave.pcm "dmix_tx_all"
    slave.channels 10
    ttable.0.1 1
}

pcm.route_tx2 {
    type route
    slave.pcm "dmix_tx_all"
    slave.channels 10
    ttable.0.0 1
}

pcm.route_tx3 {
    type route
    slave.pcm "dmix_tx_all"
    slave.channels 10
    ttable.0.3 1
}

pcm.route_tx4 {
    type route
    slave.pcm "dmix_tx_all"
    slave.channels 10
    ttable.0.2 1
}

pcm.tx1 {
    type plug
    slave.pcm "route_tx1"
}

pcm.tx2 {
    type plug
    slave.pcm "route_tx2"
}

pcm.tx3 {
    type plug
    slave.pcm "route_tx3"
}

pcm.tx4 {
    type plug
    slave.pcm "route_tx4"
}
